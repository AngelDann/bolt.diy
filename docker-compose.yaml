services:
  bolt-diy:
    image: bolt-ai:production-v2
    restart: unless-stopped

    ports:
      - "5173:5173"

    environment:
      NODE_ENV: production
      COMPOSE_PROFILES: production
      PORT: 5173
      RUNNING_IN_DOCKER: "true"
      VITE_LOG_LEVEL: warn
      DEFAULT_NUM_CTX: 32768
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    command: sh -c "pnpm add wrangler && pnpm run dockerstart"
