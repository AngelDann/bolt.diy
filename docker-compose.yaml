services:
  app-prod:
    image: bolt-ai:production-v3
    build:
      context: .
      dockerfile: Dockerfile
      target: bolt-ai-production

    ports:
      - "5173:5173"

    environment:
      NODE_ENV: production
      COMPOSE_PROFILES: production
      PORT: 5173
      RUNNING_IN_DOCKER: "true"
      VITE_LOG_LEVEL: warn
      DEFAULT_NUM_CTX: 32768
      OPENAI_API_KEY: ${OPENAI_API_KEY}

    restart: unless-stopped
